<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#eef1f5; font-family:'Noto Sans SC',sans-serif; color:#1c2430; font-variant-numeric: tabular-nums; }
  .page { width:900px; margin:0 auto; background:#eef1f5; }

  /* ---------- header ---------- */
  .hero { background:linear-gradient(135deg,#ffffff 0%,#f6f8fb 55%,#edf1f8 100%); color:#1c2430; padding:44px 48px 36px; position:relative; overflow:hidden; border-bottom:1px solid #e6e9ef; box-shadow:0 2px 10px rgba(16,32,64,.04); }
  .hero .deco { position:absolute; right:-90px; top:-90px; width:340px; height:340px; border-radius:50%; border:44px solid rgba(19,41,78,.045); }
  .hero .deco2 { position:absolute; right:60px; bottom:-130px; width:240px; height:240px; border-radius:50%; border:30px solid rgba(217,178,95,.12); }
  .hero-top { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .tag { font-size:13px; letter-spacing:2px; color:#b8862f; border:1px solid rgba(217,178,95,.55); background:rgba(217,178,95,.07); padding:4px 12px; border-radius:3px; }
  .tag.dark { color:#68758a; border-color:rgba(104,117,138,.32); background:rgba(104,117,138,.05); }
  h1 { font-size:44px; font-weight:900; letter-spacing:3px; margin:18px 0 10px; position:relative; z-index:1; color:#13294e; }
  h1 .accent { color:#c9974a; }
  .hero-sub { font-size:16px; color:#5a6778; letter-spacing:1px; position:relative; z-index:1; }
  .hero-sub b { color:#b8862f; font-weight:700; }
  .hero-line { width:64px; height:5px; background:linear-gradient(90deg,#e8c37e,#e0392e); border-radius:3px; margin-top:20px; }

  /* ---------- stats ---------- */
  .stats { display:flex; gap:14px; padding:22px 32px 6px; }
  .stat { flex:1; background:#fff; border-radius:10px; padding:18px 16px 16px; border:1px solid #e6e9ef; box-shadow:0 2px 8px rgba(16,32,64,.05); position:relative; overflow:hidden; }
  .stat::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; }
  .stat.v::before { background:#7c8aa0; }
  .stat.in::before { background:#e0392e; }
  .stat.out::before { background:#0a9c5b; }
  .stat.net::before { background:#13294e; }
  .stat .k { font-size:13px; color:#8a93a3; margin-bottom:8px; }
  .stat .v { font-size:30px; font-weight:900; line-height:1; }
  .stat .v small { font-size:14px; font-weight:500; color:#8a93a3; margin-left:4px; }
  .stat .s { font-size:12px; color:#9aa3b2; margin-top:7px; }
  .c-up { color:#d92c20; } .c-down { color:#06894f; } .c-mid { color:#13294e; }

  /* ---------- section ---------- */
  .sec { padding:26px 32px 8px; }
  .sec-head { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
  .sec-no { font-size:13px; font-weight:900; color:#d9b25f; letter-spacing:1px; }
  .sec-title { font-size:22px; font-weight:900; color:#13294e; letter-spacing:1px; }
  .sec-note { font-size:12px; color:#9aa3b2; margin-left:auto; }

  /* ---------- diverging bars ---------- */
  .chart { background:#fff; border-radius:10px; border:1px solid #e6e9ef; padding:16px 20px 10px; box-shadow:0 2px 8px rgba(16,32,64,.05); }
  .crow { display:flex; align-items:center; height:29px; }
  .crow .name { width:96px; font-size:13px; font-weight:700; color:#2a3648; flex:none; }
  .crow .cnt { width:34px; flex:none; font-size:11px; color:#9aa3b2; }
  .crow .zone { flex:1; height:100%; position:relative; }
  .zone .axis { position:absolute; left:50%; top:3px; bottom:3px; width:1px; background:#e3e7ee; }
  .zone .bar { position:absolute; top:8px; height:13px; border-radius:2px; }
  .zone .bar.pos { left:50%; background:linear-gradient(90deg,#f06a5e,#e0392e); }
  .zone .bar.neg { right:50%; background:linear-gradient(270deg,#3ec58a,#0a9c5b); }
  .crow .val { width:86px; flex:none; text-align:right; font-size:13px; font-weight:700; }
  .chart-legend { display:flex; justify-content:center; gap:26px; padding:8px 0 6px; font-size:12px; color:#8a93a3; }
  .lg { display:flex; align-items:center; gap:6px; }
  .lg i { width:18px; height:8px; border-radius:2px; display:inline-block; }

  /* ---------- sector cards ---------- */
  .cards { display:flex; flex-direction:column; gap:14px; }
  .card { background:#fff; border-radius:10px; border:1px solid #e6e9ef; box-shadow:0 2px 8px rgba(16,32,64,.05); overflow:hidden; }
  .card-h { display:flex; align-items:center; gap:10px; padding:13px 18px; background:#f7f9fc; border-bottom:1px solid #edf0f5; }
  .card-h.pin { border-left:4px solid #e0392e; }
  .card-h.nin { border-left:4px solid #0a9c5b; }
  .card-h .sname { font-size:17px; font-weight:900; color:#13294e; letter-spacing:1px; }
  .card-h .scnt { font-size:11px; color:#68758a; background:#eef1f6; border-radius:10px; padding:2px 9px; }
  .card-h .sflow { margin-left:auto; font-size:16px; font-weight:900; }
  .cols { display:grid; grid-template-columns:158px 1fr 96px 116px; padding:7px 18px; font-size:11px; color:#9aa3b2; border-bottom:1px solid #f0f2f6; }
  .cols div:nth-child(3),.cols div:nth-child(4) { text-align:right; }
  .row { display:grid; grid-template-columns:158px 1fr 96px 116px; align-items:center; padding:9px 18px; border-bottom:1px solid #f4f6f9; }
  .row:nth-child(even) { background:#fafbfd; }
  .row:last-child { border-bottom:none; }
  .row .nm { line-height:1.25; }
  .row .nm b { font-size:15px; font-weight:700; color:#1c2430; }
  .row .nm .badge2 { font-size:10px; color:#8a6417; background:#fdf3dd; border-radius:8px; padding:1px 6px; margin-left:6px; font-weight:500; vertical-align:1px; }
  .row .nm span { display:block; font-size:11px; color:#a5adbb; margin-top:1px; }
  .row .sub { font-size:12px; color:#68758a; }
  .row .pct { text-align:right; }
  .row .pct i { font-style:normal; font-size:13px; font-weight:700; border-radius:4px; padding:3px 8px; }
  .i-up { color:#d92c20; background:#fdeceb; }
  .i-down { color:#06894f; background:#e6f5ec; }
  .row .fl { text-align:right; font-size:14px; font-weight:900; }

  /* ---------- insights ---------- */
  .tips { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tip { background:#fff; border-radius:10px; border:1px solid #e6e9ef; box-shadow:0 2px 8px rgba(16,32,64,.05); padding:16px 18px; }
  .tip .t { font-size:14px; font-weight:900; margin-bottom:7px; color:#13294e; display:flex; align-items:center; gap:8px; }
  .tip .t .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .tip p { font-size:12.5px; line-height:1.75; color:#4a5568; }
  .tip p b.r { color:#d92c20; } .tip p b.g { color:#06894f; }

  /* ---------- footer ---------- */
  .foot { margin:26px 32px 34px; background:#fff; border:1px solid #e6e9ef; border-radius:10px; color:#4a5568; padding:18px 22px; box-shadow:0 2px 8px rgba(16,32,64,.05); }
  .foot .ft { font-size:13px; font-weight:700; color:#b8862f; margin-bottom:6px; }
  .foot p { font-size:11.5px; line-height:1.8; color:#68758a; }
  .foot .disc { margin-top:8px; padding-top:8px; border-top:1px solid #e6e9ef; color:#9aa3b2; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="deco"></div><div class="deco2"></div>
    <div class="hero-top">
      <span class="tag">同花顺 iFinD</span><span class="tag dark">龙虎榜数据</span><span class="tag dark" id="date-tag"></span>
    </div>
    <h1 id="h1">龙虎榜 <span class="accent">·</span> 板块资金分布</h1>
    <div class="hero-sub" id="hero-sub"></div>
    <div class="hero-line"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="sec" id="sec-flow">
    <div class="sec-head"><span class="sec-no">01</span><span class="sec-title">板块资金分布</span><span class="sec-note">单位：亿元 ｜ 按主力净流入排序</span></div>
    <div class="chart" id="chart"></div>
    <div class="chart-legend">
      <span class="lg"><i style="background:linear-gradient(90deg,#f06a5e,#e0392e)"></i>净流入（右）</span>
      <span class="lg"><i style="background:linear-gradient(270deg,#3ec58a,#0a9c5b)"></i>净流出（左）</span>
    </div>
  </div>

  <div class="sec" id="sec-cards">
    <div class="sec-head"><span class="sec-no">02</span><span class="sec-title">分板块个股明细</span><span class="sec-note">组内按主力净流入排序 ｜ 红涨绿跌</span></div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="sec" id="sec-tips">
    <div class="sec-head"><span class="sec-no">03</span><span class="sec-title">盘面要点</span></div>
    <div class="tips" id="tips"></div>
  </div>

  <div class="foot">
    <div class="ft">口径说明</div>
    <p id="foot-note"></p>
    <p class="disc">数据来源：同花顺 iFinD（search_stocks / get_stock_performance）｜ 以上内容基于公开数据，不构成投资建议。</p>
  </div>

</div>

<!-- 数据注入占位：由 analyze_lhb.py 替换 __LHB_DATA__ -->
<script id="lhb-data" type="application/json">__LHB_DATA__</script>

<script>
const DATA = JSON.parse(document.getElementById('lhb-data').textContent);
const SECTORS = DATA.sectors;

document.getElementById('date-tag').textContent = DATA.meta.dateTag;
document.getElementById('hero-sub').innerHTML =
  `<b>${DATA.meta.nStocks}</b> 只上榜个股按同花顺行业整合为 <b>${DATA.meta.nSectors}</b> 个板块 ｜ 主力资金净流向一览`;
document.getElementById('foot-note').innerHTML =
  `① 数据为 ${DATA.meta.dateHyphen} 交易日收盘后维度；② 涨跌幅为前复权口径；③ 资金列为主力资金净流入额（正 = 净流入，负 = 净流出）；④ 板块归类采用同花顺行业分类（展示至二级/三级细分）；⑤ 金额单位：亿元 / 万元。`;

/* ---- 统计卡片 ---- */
DATA.stats.forEach(s => {
  const el = document.createElement('div');
  el.className = 'stat ' + s.bar;
  el.innerHTML = `<div class="k">${s.k}</div><div class="v ${s.cls}">${s.v}<small>${s.unit}</small></div><div class="s">${s.s}</div>`;
  document.getElementById('stats').appendChild(el);
});

/* ---- 盘面要点 ---- */
DATA.tips.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tip';
  el.innerHTML = `<div class="t"><span class="dot" style="background:${t.color}"></span>${t.title}</div><p>${t.html}</p>`;
  document.getElementById('tips').appendChild(el);
});

function fmtFlow(v){
  const s = v>0?'+':(v<0?'-':''), a=Math.abs(v);
  return s + (a>=10000 ? (a/10000).toFixed(2)+'亿' : Math.round(a)+'万');
}
function pctCls(p){ return p>=0?'i-up':'i-down'; }
function pctTxt(p){ return (p>0?'+':'')+p.toFixed(2)+'%'; }
function flowCls(v){ return v>=0?'c-up':'c-down'; }

/* ---- section 01: diverging bars ---- */
const MAXABS = Math.max(...SECTORS.map(s=>Math.abs(s[1])));
const chart = document.getElementById('chart');
SECTORS.forEach(([name,flow])=>{
  const w = Math.max(3, Math.abs(flow)/MAXABS*172);
  const r = document.createElement('div'); r.className='crow';
  r.innerHTML = `<div class="name">${name}</div><div class="cnt">${SECTORS.find(s=>s[0]===name)[2].length}只</div>`
    + `<div class="zone"><div class="axis"></div>`
    + (flow>=0 ? `<div class="bar pos" style="width:${w}px"></div>` : `<div class="bar neg" style="width:${w}px"></div>`)
    + `</div><div class="val ${flowCls(flow)}">${fmtFlow(flow)}</div>`;
  chart.appendChild(r);
});

/* ---- section 02: sector cards ---- */
const cards = document.getElementById('cards');
SECTORS.forEach(([name,flow,stocks])=>{
  const card = document.createElement('div'); card.className='card';
  let rows = stocks.map(([n,c,sub,chg,f,times])=>{
    const badge = times?`<span class="badge2">${times}次上榜</span>`:'';
    return `<div class="row">
      <div class="nm"><b>${n}</b>${badge}<span>${c}</span></div>
      <div class="sub">${sub}</div>
      <div class="pct"><i class="${pctCls(chg)}">${pctTxt(chg)}</i></div>
      <div class="fl ${flowCls(f)}">${fmtFlow(f)}</div>
    </div>`;
  }).join('');
  card.innerHTML = `<div class="card-h ${flow>=0?'pin':'nin'}">
      <span class="sname">${name}</span><span class="scnt">${stocks.length} 只上榜</span>
      <span class="sflow ${flowCls(flow)}">${fmtFlow(flow)}</span>
    </div>
    <div class="cols"><div>个股 / 代码</div><div>细分板块</div><div>当日涨跌幅</div><div>主力净流入</div></div>
    ${rows}`;
  cards.appendChild(card);
});
document.title='ok';
</script>
</body>
</html>
